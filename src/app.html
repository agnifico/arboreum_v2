<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Fira+Code:wght@300..700&family=Raleway+Dots&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Silkscreen:wght@400;700&family=Teko:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Arboreum</title>
    %sveltekit.head%
    <script>
      // The device (/) renders in the browser only: until it loads, paint its
      // mat in the remembered theme's colour (settings.js saves it).
      if (location.pathname === "/") {
        var mat = "#ebe8e0";
        try { mat = JSON.parse(localStorage.getItem("JXF26-ARB-16A-config")).mat || mat; } catch (e) {}
        document.documentElement.style.background = mat;
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" style="padding: 0; margin: 0">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
